<script>
let audioCtx;
function openLetter(){
 document.getElementById('start').classList.add('hidden');
 document.getElementById('gift').classList.remove('hidden');
 burst();
}
function burst(){
 const icons=['🎉','🎈','✨','❤️','🎁','⭐'];
 for(let i=0;i<45;i++){
   let e=document.createElement('span');e.className='conf';
   e.textContent=icons[Math.floor(Math.random()*icons.length)];
   e.style.left=Math.random()*100+'vw';
   e.style.animationDelay=(Math.random()*1.2)+'s';
   document.body.appendChild(e);setTimeout(()=>e.remove(),5200);
 }
}
function playMusic(){
 if(audioCtx) return;
 audioCtx=new (window.AudioContext||window.webkitAudioContext)();
 const notes=[262,262,294,262,349,330,262,262,294,262,392,349,262,262,523,440,349,330,294,466,466,440,349,392,349];
 const times=[0,.28,.56,.84,1.12,1.40,1.85,2.13,2.41,2.69,2.97,3.25,3.70,3.98,4.26,4.54,4.82,5.10,5.38,5.66,6.10,6.38,6.66,6.94,7.22];
 notes.forEach((f,i)=>{
   let o=audioCtx.createOscillator(),g=audioCtx.createGain();
   o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,audioCtx.currentTime+times[i]);
   g.gain.exponentialRampToValueAtTime(.12,audioCtx.currentTime+times[i]+.03);
   g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+times[i]+.24);
   o.connect(g);g.connect(audioCtx.destination);o.start(audioCtx.currentTime+times[i]);o.stop(audioCtx.currentTime+times[i]+.25);
 });
}
